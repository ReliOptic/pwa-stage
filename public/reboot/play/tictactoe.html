<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>세 줄 잇기</title>
<style>
html,body{margin:0;height:100%;background:transparent;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px}
#b{display:grid;grid-template-columns:repeat(3,96px);gap:8px}
button{border:0;padding:0;background:#2e2e31;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform 140ms cubic-bezier(0.22,1,0.36,1)}
button:active{transform:scale(0.92)}
#b button{width:96px;height:96px;border-radius:24px;display:flex;align-items:center;justify-content:center}
#b button.win{background:#3a3a3e}
#b i{width:40px;height:40px;box-sizing:border-box;transform:scale(0);transition:transform 380ms cubic-bezier(0.3,1.4,0.5,1)}
#b i.o{border:6px solid #f0a47c;border-radius:50%;transform:scale(1)}
#b i.x{background:#ededed;border-radius:8px;transform:scale(1)}
#r{width:52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div id="b"></div>
<button id="r" aria-label="다시 두기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ededed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v3h3"/></svg></button>
<script>
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let g=Array(9).fill(''),busy=false;const b=document.getElementById('b');
const win=()=>L.find(l=>g[l[0]]&&g[l[0]]===g[l[1]]&&g[l[1]]===g[l[2]])||null;
function draw(){const w=win();b.querySelectorAll('button').forEach((el,i)=>{el.className=w&&w.includes(i)?'win':'';el.firstChild.className=g[i];});}
for(let i=0;i<9;i++){const el=document.createElement('button');el.setAttribute('aria-label',(i+1)+'번 칸');el.appendChild(document.createElement('i'));el.onclick=()=>{if(g[i]||win()||busy)return;g[i]='o';draw();const e=g.map((x,k)=>x?-1:k).filter(k=>k>=0);if(win()||!e.length)return;busy=true;setTimeout(()=>{g[e[Math.floor(Math.random()*e.length)]]='x';busy=false;draw();},380);};b.appendChild(el);}
document.getElementById('r').onclick=()=>{g=Array(9).fill('');busy=false;draw();};
</script></body></html>
