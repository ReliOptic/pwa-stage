<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>솔 머그</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vista.css"></head>
<body><div id="stage" style="position: absolute; inset: 0; overflow: hidden; color: #ededed; background: #1a1410">

              <div style="position: absolute; left: 24px; top: 24px; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 13px; line-height: 20px; color: #b8a995">오늘의 물건</span>
                <span style="font-size: 28px; line-height: 32px; font-weight: 500">솔 머그</span>
              </div>
              <div aria-hidden="true" style="position: absolute; left: 50%; top: 132px; width: 96px; height: 48px; margin-left: -64px; display: flex; justify-content: space-between; align-items: flex-end">
                <span class="steam" style="width: 8px; height: 32px; border-radius: 4px; background: #b8a995; opacity: 0"></span>
                <span class="steam" style="width: 8px; height: 40px; border-radius: 4px; background: #b8a995; opacity: 0; animation-delay: 0.8s"></span>
                <span class="steam" style="width: 8px; height: 32px; border-radius: 4px; background: #b8a995; opacity: 0; animation-delay: 1.6s"></span>
              </div>
              <button aria-label="솔 머그" data-link="https://www.coupang.com/" data-kind="web" data-label="coupang.com" class="tilt" style="position: absolute; left: 50%; top: 184px; width: 200px; height: 180px; margin-left: -100px; transform-origin: 50% 100%">
                <span style="position: absolute; left: 132px; top: 40px; width: 60px; height: 76px; box-sizing: border-box; border: 14px solid #e8d9c3; border-radius: 0 32px 32px 0"></span>
                <span style="position: absolute; left: 16px; top: 16px; width: 132px; height: 148px; border-radius: 12px 12px 40px 40px; background: #e8d9c3"></span>
                <span style="position: absolute; left: 28px; top: 28px; width: 16px; height: 96px; border-radius: 8px; background: rgba(255,255,255,0.45)"></span>
              </button>
              <div style="position: absolute; left: 24px; right: 120px; bottom: 24px; height: 56px">
                <span class="third" style="position: absolute; left: 0; bottom: 0; font-size: 20px; line-height: 28px; font-weight: 500; opacity: 1">손에 맞게 기운 손잡이</span>
                <span class="third" style="position: absolute; left: 0; bottom: 0; font-size: 20px; line-height: 28px; font-weight: 500; opacity: 0; animation-delay: 4s">두 겹이라 오래 따뜻합니다</span>
                <span class="third" style="position: absolute; left: 0; bottom: 0; font-size: 20px; line-height: 28px; font-weight: 500; opacity: 0; animation-delay: 8s">식기세척기에 넣어도 됩니다</span>
              </div>
              <span style="position: absolute; right: 24px; bottom: 24px; font-size: 20px; line-height: 28px; font-weight: 500; color: #b8a995; font-variant-numeric: tabular-nums">[가격]</span>
            
</div><script src="vista.js" data-duration="12000"></script></body></html>
