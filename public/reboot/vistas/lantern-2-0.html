<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>lantern 2.0 공개</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vista.css"></head>
<body><div id="stage" style="position: absolute; inset: 0; overflow: hidden; color: #ededed; background: #0e1116">

              <div style="position: absolute; left: 24px; top: 24px; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 13px; line-height: 20px; color: #9aa4b2">개발 소식</span>
                <span style="font-size: 20px; line-height: 28px; font-weight: 500">lantern</span>
              </div>
              <div style="position: absolute; left: 24px; right: 24px; top: 120px; height: 312px">
                <div class="beat" style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; opacity: 1">
                  <span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 112px; line-height: 112px; font-weight: 500; letter-spacing: -0.03em; color: #7ee0a1">2.0</span>
                  <span style="font-size: 24px; line-height: 32px; font-weight: 500">새 버전이 나왔습니다</span>
                </div>
                <div class="beat" style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 32px; opacity: 0; animation-delay: 3s">
                  <div style="display: flex; flex-direction: column; gap: 16px">
                    <span style="height: 12px; border-radius: 6px; background: rgba(255,255,255,0.08); overflow: hidden"><span class="fillslow" style="display: block; height: 12px; border-radius: 6px; background: #9aa4b2; transform-origin: 0 50%; transform: scaleX(0.6); animation-delay: 3s"></span></span>
                    <span style="height: 12px; border-radius: 6px; background: rgba(255,255,255,0.08); overflow: hidden"><span class="fill" style="display: block; height: 12px; border-radius: 6px; background: #7ee0a1; transform-origin: 0 50%; animation-delay: 3s"></span></span>
                  </div>
                  <span style="font-size: 24px; line-height: 32px; font-weight: 500">시작이 빨라졌습니다</span>
                </div>
                <div class="beat" style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 32px; opacity: 0; animation-delay: 6s">
                  <div style="display: flex; flex-direction: column; gap: 8px; width: 200px">
                    <div style="display: flex; gap: 16px">
                      <span class="drop" style="width: 56px; height: 56px; border-radius: 16px; background: #7ee0a1; animation-delay: 6.2s"></span>
                      <span class="drop" style="width: 56px; height: 56px; border-radius: 16px; background: #9aa4b2; animation-delay: 6.5s"></span>
                      <span class="drop" style="width: 56px; height: 56px; border-radius: 16px; background: #ededed; animation-delay: 6.8s"></span>
                    </div>
                    <span style="height: 16px; border-radius: 8px; background: rgba(255,255,255,0.16)"></span>
                  </div>
                  <span style="font-size: 24px; line-height: 32px; font-weight: 500">플러그인을 붙일 수 있습니다</span>
                </div>
                <div class="beat" style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 32px; opacity: 0; animation-delay: 9s">
                  <div class="dim" style="width: 200px; height: 120px; box-sizing: border-box; padding: 20px; border-radius: 16px; background-color: #1c2128; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); display: flex; flex-direction: column; gap: 12px; animation-delay: 9s">
                    <span style="width: 96px; height: 8px; border-radius: 4px; background: rgba(128,128,128,0.7)"></span>
                    <span style="width: 160px; height: 8px; border-radius: 4px; background: rgba(128,128,128,0.45)"></span>
                    <span style="width: 128px; height: 8px; border-radius: 4px; background: rgba(128,128,128,0.45)"></span>
                  </div>
                  <span style="font-size: 24px; line-height: 32px; font-weight: 500">어두운 화면이 생겼습니다</span>
                </div>
              </div>
              <button data-link="https://github.com/" data-kind="web" data-label="github.com" style="position: absolute; left: 24px; right: 24px; bottom: 24px; height: 56px; padding: 0 20px; border-radius: 16px; background: rgba(255,255,255,0.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); color: #ededed; display: flex; align-items: center; justify-content: space-between; text-align: left">
                <span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 15px">lantern/lantern</span>
                <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #7ee0a1; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
              </button>
            
</div><script src="vista.js" data-duration="12000"></script></body></html>
