<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>세 줄 잇기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vista.css"></head>
<body><div id="stage" style="position: absolute; inset: 0; overflow: hidden; color: #ededed; background: #101418">

              <div style="position: absolute; left: 24px; top: 24px; display: flex; flex-direction: column; gap: 4px">

                  </span>
                
                  <span style="border-radius: 16px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center">

              </button>
