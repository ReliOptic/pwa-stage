<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Campsite 리부트 기준 화면 (세로 393×852)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0;width:100%;height:100%;background:#000}body{display:flex;align-items:stretch;justify-content:stretch;overflow:hidden}#root{flex:1;width:100%;height:100%}x-dc{display:none}</style>
<script src="feed.js"></script>
<script>
/* Minimal stand-in for the design canvas runtime: holes, sc-for, sc-if, events, setState → patch. Reference page only. */
(function () {
  const get = (scope, path) => {
    const p = path.trim(); if (p === 'true') return true; if (p === 'false') return false;
    let v = scope; for (const k of p.split('.')) { if (v == null) return undefined; v = v[k]; } return v;
  };
  const WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/; const ANY = /\{\{([^}]+)\}\}/g;
  const fill = (s, scope) => s.replace(ANY, (_, p) => { const v = get(scope, p); return v == null ? '' : String(v); });
  const SVG = 'http://www.w3.org/2000/svg';
  function build(node, scope, out, ns) {
    if (node.nodeType === 3) { if (node.nodeValue.trim() === '' && !/\S/.test(node.nodeValue)) return; out.push({ t: fill(node.nodeValue, scope) }); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'helmet') return;
    if (tag === 'sc-if') { out.push({ c: 'if' }); if (get(scope, (node.getAttribute('value') || '').replace(/[{}]/g, ''))) for (const ch of node.childNodes) build(ch, scope, out, ns); else out.push({ c: 'off' }); return; }
    if (tag === 'sc-for') {
      const list = get(scope, (node.getAttribute('list') || '').replace(/[{}]/g, '')) || []; const as = node.getAttribute('as') || 'item';
      out.push({ c: 'for' });
      list.forEach((item, i) => { const s2 = Object.create(scope); s2[as] = item; s2.$index = i; const kids = []; for (const ch of node.childNodes) build(ch, s2, kids, ns); out.push({ tag: 'x-row', ns: null, a: { style: 'display: contents' }, on: {}, k: kids }); });
      out.push({ c: 'end' }); return;
    }
    const myNs = tag === 'svg' ? SVG : ns; const a = {}; const on = {};
    for (const at of node.attributes) {
      if (at.name.startsWith('hint-')) continue;
      if (/^on[a-z]/.test(at.name)) { const m = at.value.match(WHOLE); const fn = m ? get(scope, m[1]) : null; if (typeof fn === 'function') on[at.name.slice(2)] = fn; continue; }
      const m = at.value.match(WHOLE); const v = m ? get(scope, m[1]) : fill(at.value, scope);
      if (v === undefined || v === null || v === false && !at.name.startsWith('aria-')) continue;
      a[at.name] = String(v);
    }
    const kids = []; for (const ch of node.childNodes) build(ch, scope, kids, myNs);
    out.push({ tag, ns: myNs, a, on, k: kids });
  }
  function make(v) {
    if (v.t !== undefined) return document.createTextNode(v.t);
    if (v.c) return document.createComment(v.c);
    const el = v.ns ? document.createElementNS(v.ns, v.tag) : document.createElement(v.tag);
    el.__on = {}; patchEl(el, v, true); return el;
  }
  function same(dom, v) { if (v.t !== undefined) return dom.nodeType === 3; if (v.c) return dom.nodeType === 8; return dom.nodeType === 1 && dom.localName === v.tag; }
  function patchEl(el, v) {
    for (const [k, val] of Object.entries(v.a)) if (el.getAttribute(k) !== val) el.setAttribute(k, val);
    for (const at of Array.from(el.attributes)) if (!(at.name in v.a)) el.removeAttribute(at.name);
    for (const type of Object.keys(v.on)) if (!el.__on[type]) el.addEventListener(type, (e) => { const f = el.__on[type]; if (f) f(e); });
    el.__on = Object.assign(el.__on, Object.fromEntries(Object.keys(el.__on).map((k) => [k, null])), v.on);
    patchKids(el, v.k);
  }
  function patchKids(parent, kids) {
    const have = Array.from(parent.childNodes);
    kids.forEach((v, i) => {
      const dom = have[i];
      if (!dom) { parent.appendChild(make(v)); return; }
      if (!same(dom, v)) { parent.replaceChild(make(v), dom); return; }
      if (v.t !== undefined) { if (dom.nodeValue !== v.t) dom.nodeValue = v.t; } else if (v.c) { if (dom.nodeValue !== v.c) dom.nodeValue = v.c; } else patchEl(dom, v);
    });
    for (let i = have.length - 1; i >= kids.length; i--) parent.removeChild(have[i]);
  }
  window.DCLogic = class { constructor(props) { this.props = props || {}; } setState(u) { this.state = Object.assign({}, this.state, typeof u === 'function' ? u(this.state) : u); if (this.__draw) this.__draw(); } forceUpdate() { if (this.__draw) this.__draw(); } };
  window.addEventListener('DOMContentLoaded', () => {
    const tpl = document.querySelector('x-dc'); const logic = document.querySelector('script[data-dc-script]');
    const helmet = tpl.querySelector('helmet'); if (helmet) for (const n of Array.from(helmet.children)) document.head.appendChild(n);
    const defaults = {}; try { const p = JSON.parse(logic.getAttribute('data-props') || '{}'); for (const [k, d] of Object.entries(p)) if (d && 'default' in d) defaults[k] = d.default; } catch (e) {}
    for (const [k, val] of new URLSearchParams(location.search)) defaults[k] = isNaN(Number(val)) ? val : Number(val);
    const Component = (0, eval)('(' + logic.textContent.replace(/^\s*class Component/, 'class Component') + ')');
    const c = new Component(defaults); const root = document.createElement('div'); root.id = 'root'; tpl.replaceWith(root);
    c.__draw = () => { const out = []; const vals = c.renderVals(); for (const ch of tpl.childNodes) build(ch, vals, out, null); patchKids(root, out); };
    c.__draw(); const d0 = c.__draw; c.__draw = () => { d0(); if (c.componentDidUpdate) c.componentDidUpdate(); }; if (c.componentDidMount) c.componentDidMount(); window.__campsite = c;
  });
})();
</script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;padding:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.press{transition:transform 140ms cubic-bezier(0.22,1,0.36,1),background-color 140ms cubic-bezier(0.22,1,0.36,1)}
.press:active{transform:scale(0.92)}
.soft:hover{background-color:var(--raised)}
.sx{scrollbar-width:none}.sx::-webkit-scrollbar{display:none}
.rail::-webkit-scrollbar{display:none}
@keyframes marqA{from{transform:translateX(0)}to{transform:translateX(calc(-100% + 172px))}}
@keyframes marqB{from{transform:translateX(0)}to{transform:translateX(calc(-100% + 172px))}}
.run .beat{animation:beat 12s cubic-bezier(0.22,1,0.36,1) infinite both;animation-play-state:var(--ps)}
.run .fill{animation:fill 12s cubic-bezier(0.22,1,0.36,1) infinite both;animation-play-state:var(--ps)}
.run .fillslow{animation:fillslow 12s linear infinite both;animation-play-state:var(--ps)}
.run .drop{animation:drop 12s cubic-bezier(0.3,1.4,0.5,1) infinite both;animation-play-state:var(--ps)}
.run .dim{animation:dim 12s linear infinite both;animation-play-state:var(--ps)}
.run .steam{animation:steam 2.4s linear infinite both;animation-play-state:var(--ps)}
.run .tilt{animation:tilt 4s cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--ps)}
.run .third{animation:third 12s cubic-bezier(0.22,1,0.36,1) infinite both;animation-play-state:var(--ps)}
</style>
</helmet>
<div style="--page: {{v.page}}; --bg: {{v.bg}}; --surf: {{v.surf}}; --raised: {{v.raised}}; --fg: {{v.fg}}; --fg2: {{v.fg2}}; --fg3: {{v.fg3}}; --hair: {{v.hair}}; --lift: {{v.lift}}; --acc: {{v.acc}}; --knob: {{v.knob}}; --off: {{v.off}}; position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--page); color: var(--fg); font-family: 'IBM Plex Sans KR', system-ui, sans-serif; font-size: 15px; line-height: 22px; user-select: none; -webkit-user-select: none">

  <!-- 커튼: 다이내믹 아일랜드 아래에서 시작한다 -->
  <div style="position: absolute; left: {{lay.sheetL}}; right: {{lay.sheetR}}; top: 0; height: {{lay.curH}}; box-sizing: border-box; padding: {{lay.curPad}}; background: var(--surf); border-radius: 0 0 32px 32px; box-shadow: 0 -120px 0 0 var(--surf), inset 0 -1px 0 var(--hair); display: flex; flex-direction: column; gap: 12px; transform: {{sheetTf}}; transition: {{curTr}}">
    <div style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 12px">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--raised); display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: var(--fg2); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"></path></svg>
      </div>
      <div style="font-size: 18px; line-height: 24px; font-weight: 500">내 캠프</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{switches}}" as="s" hint-placeholder-count="4">
        <button class="soft" role="switch" aria-checked="{{s.on}}" onClick="{{s.flip}}" style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 12px; border-radius: 16px; text-align: left; transition: background-color 140ms cubic-bezier(0.22,1,0.36,1)">
          <span>{{s.label}}</span>
          <span style="position: relative; width: 52px; height: 32px; border-radius: 16px; background: {{s.track}}; transition: background-color 160ms cubic-bezier(0.22,1,0.36,1)">
            <span style="position: absolute; left: 2px; top: 2px; width: 28px; height: 28px; border-radius: 14px; background: {{s.knob}}; box-shadow: 0 1px 2px rgba(0,0,0,0.2); transform: {{s.knobTf}}; transition: transform 380ms cubic-bezier(0.3,1.4,0.5,1), background-color 160ms cubic-bezier(0.22,1,0.36,1)"></span>
          </span>
        </button>
      </sc-for>
    </div>
    <div style="height: 1px; margin: 0 12px; background: var(--hair)"></div>
    <button class="soft press" style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 12px; border-radius: 16px; text-align: left">
      <span>담아 둔 링크</span>
      <span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: var(--fg2); font-variant-numeric: tabular-nums">{{keptCount}}</span>
    </button>
    <button class="soft press" style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 12px; border-radius: 16px; text-align: left">
      <span>홈 화면에 추가</span>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: var(--fg3); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <button aria-label="커튼 올리기" onClick="{{closeCurtain}}" style="margin-top: auto; align-self: center; width: 64px; height: 24px; display: flex; align-items: center; justify-content: center">
      <span style="width: 36px; height: 4px; border-radius: 2px; background: var(--fg3)"></span>
    </button>
  </div>

  <!-- 앱 전체: 커튼이 내려오면 한 장으로 물러난다 -->
  <div style="position: absolute; inset: 0; background: var(--bg); overflow: hidden; transform-origin: 50% 0; transform: {{appTf}}; border-radius: {{appRadius}}; transition: {{curTr}}">

    <!-- Duo Inner (Regular Width): 좌측 수직 캠프 레일 (76pt) -->
    <sc-if value="{{lay.isRegular}}" hint-placeholder-val="{{false}}">
      <aside aria-label="캠프" style="position: absolute; left: 0; top: 0; bottom: 0; width: 76px; box-sizing: border-box; padding: {{lay.railTopPad}} 0 18px; background: var(--bg); box-shadow: inset -1px 0 0 var(--hair); display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 6; transform: {{lay.sideRailTf}}; transition: transform 360ms cubic-bezier(0.22,1,0.36,1)">
        <button aria-label="캠프 레일 접기" onClick="{{toggleRail}}" class="soft press" style="flex: none; width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--fg2)">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><path d="M9 4.5v15"></path></svg>
        </button>
        <div class="sx" style="flex: 1; width: 100%; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 6px 0">
          <sc-for list="{{disks}}" as="k" hint-placeholder-count="5">
            <button onClick="{{k.pick}}" aria-label="{{k.camp}}" class="press" style="position: relative; flex: none; width: 46px; height: 46px; border-radius: 50%; background: {{k.ground}} url({{k.poster}}) center / cover; box-shadow: {{k.ring}}; opacity: {{k.op}}; transition: opacity 200ms linear, box-shadow 160ms cubic-bezier(0.22,1,0.36,1); display: flex; align-items: center; justify-content: center">
              <svg width="54" height="54" viewBox="0 0 52 52" aria-hidden="true" style="position: absolute; left: -4px; top: -4px; transform: rotate(-90deg); pointer-events: none"><circle cx="26" cy="26" r="25" style="fill: none; stroke: var(--acc); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 157.1; stroke-dashoffset: {{k.ringOff}}; transition: stroke-dashoffset 120ms linear"></circle></svg>
            </button>
          </sc-for>
        </div>
        <button aria-label="캠프 추가" onClick="{{openAdd}}" class="press" style="flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--raised); box-shadow: var(--lift); display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </aside>
    </sc-if>

    <!-- 상단: 0–59는 다이내믹 아일랜드 자리로 비운다(Duo는 상단 여백 축소 + 우측 시스템 바 비움). 이 영역 전체가 커튼 손잡이다 -->
    <header onPointerDown="{{hd}}" onPointerMove="{{hm}}" onPointerUp="{{hu}}" onPointerCancel="{{hu}}" style="position: absolute; left: {{lay.headL}}; right: {{lay.headR}}; top: 0; height: {{lay.headH}}; box-sizing: border-box; padding: {{lay.headPad}}; display: flex; align-items: center; justify-content: space-between; touch-action: none; z-index: 4">
      <sc-if value="{{lay.showRailPeek}}" hint-placeholder-val="{{false}}">
        <button aria-label="캠프 레일 펼치기" onClick="{{toggleRail}}" class="soft press" style="width: 44px; height: 44px; border-radius: 14px; background: var(--surf); box-shadow: var(--lift); display: flex; align-items: center; justify-content: center; color: var(--fg)">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><path d="M9 4.5v15"></path></svg>
        </button>
      </sc-if>
      <sc-if value="{{lay.hideRailPeek}}" hint-placeholder-val="{{true}}">
        <span style="width: 44px; height: 44px"></span>
      </sc-if>
      <div role="tablist" style="display: flex; gap: 4px; padding: 4px; height: 44px; box-sizing: border-box; border-radius: 22px; background: var(--surf); box-shadow: var(--lift)">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
          <button role="tab" aria-selected="{{m.on}}" onClick="{{m.pick}}" class="press" style="height: 36px; padding: 0 16px; border-radius: 18px; font-weight: 500; background: {{m.bg}}; color: {{m.fg}}">{{m.label}}</button>
        </sc-for>
      </div>
      <button aria-label="내 캠프 열기" onClick="{{openCurtain}}" class="press" style="position: relative; width: 44px; height: 44px; border-radius: 50%; background: var(--surf); box-shadow: var(--lift); display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"></path></svg>
        <span aria-hidden="true" style="position: absolute; right: 0; top: 0; width: 12px; height: 12px; box-sizing: border-box; border-radius: 6px; background: var(--acc); border: 2px solid var(--bg); opacity: {{dotOp}}; transition: opacity 160ms linear"></span>
      </button>
    </header>

    <div style="visibility: {{feedVis}}">
      <!-- 무대: 위아래는 캠프 안의 다음 편, 좌우는 다음 캠프 -->
      <div role="group" aria-label="작품" onPointerDown="{{pd}}" onPointerMove="{{pm}}" onPointerUp="{{pu}}" onPointerCancel="{{pu}}" style="position: absolute; left: {{lay.stageL}}; right: {{lay.stageR}}; top: {{lay.stageT}}; bottom: {{lay.stageB}}; border-radius: 32px; overflow: hidden; touch-action: none; cursor: grab">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
          <div style="position: absolute; inset: 0; border-radius: 32px; overflow: hidden; color: #ededed; background: {{c.ground}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); transform: {{c.tf}}; transition: {{c.tr}}">
            <iframe title="{{c.title}}" src="{{c.src}}" data-vista="{{c.id}}" sandbox="allow-scripts" style="position: absolute; left: 0; top: 0; width: {{lay.iframeW}}; height: {{lay.iframeH}}; transform-origin: 0 0; transform: {{lay.iframeTf}}; border: 0; pointer-events: none"></iframe>
          </div>
        </sc-for>
        <div aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; background: #19191b; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: {{discOp}}; transform: {{discTf}}; transition: opacity 160ms cubic-bezier(0.22,1,0.36,1), transform 380ms cubic-bezier(0.3,1.4,0.5,1)">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: #ededed; stroke: none"><path d="M8 5l12 7-12 7z"></path></svg>
        </div>
        <!-- 링크를 누르는 동안: 어디로 가는지가 손끝 위에 뜬다 -->
        <div aria-hidden="true" style="position: absolute; left: 0; top: 0; pointer-events: none; opacity: {{chipOp}}; transform: {{chipTf}}; transition: opacity 120ms linear">
          <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 18px; background: {{chipBg}}; color: #141415; font-size: 13px; font-weight: 500; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.3); transform: {{chipIn}}; transition: transform 320ms cubic-bezier(0.3,1.4,0.5,1), background-color 160ms cubic-bezier(0.22,1,0.36,1)">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: {{chipFill}}; stroke: #141415; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="{{chipPath}}"></path></svg>
            <span>{{chipText}}</span>
          </div>
        </div>
      </div>

      <!-- 진행선: 칸 수가 이 캠프의 편 수 -->
      <div style="position: absolute; left: {{lay.segsL}}; right: {{lay.segsR}}; bottom: {{lay.segsB}}; height: 4px; display: flex; justify-content: center; gap: 6px">
        <sc-for list="{{segs}}" as="g" hint-placeholder-count="3">
          <span style="flex: none; width: {{g.w}}; height: 4px; border-radius: 2px; background: {{g.bg}}; overflow: hidden; transition: width 420ms cubic-bezier(0.3,1.4,0.5,1), background-color 160ms cubic-bezier(0.22,1,0.36,1)"><span style="display: block; width: 100%; height: 4px; border-radius: 2px; background: var(--fg); transform-origin: 0 50%; transform: {{g.tf}}; opacity: {{g.op}}"></span></span>
        </sc-for>
      </div>

      <!-- 제목과 동작 -->
      <div style="position: absolute; left: {{lay.metaL}}; right: {{lay.metaR}}; bottom: {{lay.metaB}}; height: 52px; display: flex; flex-direction: {{rowDir}}; align-items: center; gap: 16px">
        <div style="flex: 1; min-width: 0; padding: 0 16px; display: flex; flex-direction: column; overflow: hidden">
          <span style="font-size: 13px; line-height: 20px; color: var(--fg2)">{{cur.campLine}}</span>
          <span style="display: inline-block; align-self: flex-start; font-weight: 500; white-space: nowrap; animation: {{marq}}">{{cur.title}}</span>
        </div>
        <sc-if value="{{lay.inlineActions}}" hint-placeholder-val="{{true}}">
          <sc-if value="{{cur.guest}}" hint-placeholder-val="{{false}}"><button aria-label="팔로우" onClick="{{followCur}}" class="press" style="flex: none; width: 52px; height: 52px; border-radius: 26px; background: var(--acc); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #141415; stroke-width: 2; stroke-linecap: round"><path d="M12 6v12M6 12h12"></path></svg></button></sc-if>
          <div style="flex: none; display: flex; gap: 4px; padding: 4px; height: 52px; box-sizing: border-box; border-radius: 26px; background: var(--surf); box-shadow: var(--lift)">
            <button aria-label="좋아요" aria-pressed="{{cur.liked}}" onClick="{{like}}" class="soft press" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">

        if (p.axis === 'x') this.setCamp(Math.max(0, Math.min(n - 1, s.camp + step)));

      },
      rd: (e) => { e.currentTarget.setPointerCapture(e.pointerId); const r = e.currentTarget.getBoundingClientRect(); this.q = { x: e.clientX, at: Date.now(), k: 293 / Math.max(r.width, 1), mid: r.left + r.width / 2, moved: false }; },
      rm: (e) => {

        }

        const to = Math.max(-0.3, Math.min(n - 0.7, s.camp - d / SLOT)); this.setState({ dx: (s.camp - to) * SX, dy: 0, dragging: true });
      },
      ru: (e) => {
        const q = this.q; this.q = null; if (!q) return; const d = (e.clientX - q.x) * q.k;
        const to = q.moved ? s.camp - (d + (d / Math.max(Date.now() - q.at, 1)) * 160) / SLOT : s.camp + ((e.clientX - q.mid) * q.k) / SLOT;
        if (s.mode !== 0) this.setState({ mode: 0 }); this.setCamp(Math.max(0, Math.min(n - 1, Math.round(to))));
      },
      hd: (e) => { this.h = { y: e.clientY, cap: false, k: scaleOf(e, W) }; },
      hm: (e) => { if (!this.h) return; const dy = (e.clientY - this.h.y) * this.h.k; if (!this.h.cap) { if (dy < 8) return; this.h.cap = true; e.currentTarget.setPointerCapture(e.pointerId); } this.setState({ cur: Math.max(0, Math.min(1.04, dy / this.CH)), curDrag: true }); },
      hu: () => { const hh = this.h; this.h = null; if (!hh || !hh.cap) return; this.setState({ cur: this.state.cur > 0.22 ? 1 : 0, curDrag: false }); },
      od: (e) => { e.currentTarget.setPointerCapture(e.pointerId); this.o = { y: e.clientY, moved: false, k: scaleOf(e, W) }; },
      om: (e) => { if (!this.o) return; const dy = (e.clientY - this.o.y) * this.o.k; if (!this.o.moved && Math.abs(dy) < 8) return; this.o.moved = true; this.setState({ cur: Math.max(0, Math.min(1.04, 1 + dy / this.CH)), curDrag: true }); },
      ou: () => { const o = this.o; this.o = null; if (!o) return; this.setState({ cur: o.moved && this.state.cur > 0.8 ? 1 : 0, curDrag: false }); }
    };
  }
