name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify fold optics and in-device video in macOS Electron
        if: runner.os == 'macOS'
        run: |
          ./node_modules/.bin/electron tests/electron/motion.cjs
          ./node_modules/.bin/electron tests/electron/focus.cjs
          ./node_modules/.bin/electron tests/electron/media.cjs
          ./node_modules/.bin/electron tests/electron/gestures.cjs
          ./node_modules/.bin/electron tests/electron/mobile-rendering.cjs
          ./node_modules/.bin/electron tests/electron/web-apps.cjs
        timeout-minutes: 8
      - name: Verify in-device video and capture location on Windows
        if: runner.os == 'Windows'
        run: |
          node_modules/.bin/electron.cmd tests/electron/media.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node_modules/.bin/electron.cmd tests/electron/gestures.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node_modules/.bin/electron.cmd tests/electron/mobile-rendering.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node_modules/.bin/electron.cmd tests/electron/web-apps.cjs
        timeout-minutes: 4
      - name: Real Electron regression flows
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 2560x1800x24" npm run test:electron
        env:
          SIMULATOR_TEST_NO_SANDBOX: '1'
          SIMULATOR_RECORD_MOTION: '1'
      - name: Display aperture pixel checks
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 4000x2400x24" npm run test:visual
        env:
          SIMULATOR_TEST_NO_SANDBOX: '1'
      # Internal tool: never publish releases or upload installers from public repos.
      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && github.event.repository.private == true
        with:
          name: windows-installer-internal
          path: dist_dmg/*.exe
          retention-days: 7

      - name: Package internal Apple Silicon app
        if: runner.os == 'macOS' && github.event.repository.private == true
        run: npx electron-builder --mac zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && github.event.repository.private == true
        with:
          name: mac-arm64-internal
          path: dist_dmg/*.zip
          retention-days: 7
