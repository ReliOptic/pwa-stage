name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Real Electron regression flows
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 2560x1800x24" npm run test:electron
        env:
          SIMULATOR_TEST_NO_SANDBOX: '1'
          SIMULATOR_RECORD_MOTION: '1'
      - name: Display aperture pixel checks
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 4000x2400x24" npm run test:visual
        env:
          SIMULATOR_TEST_NO_SANDBOX: '1'
      # Internal tool: never publish releases or upload installers from public repos.
      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && github.event.repository.private == true
        with:
          name: windows-installer-internal
          path: dist_dmg/*.exe
          retention-days: 7
